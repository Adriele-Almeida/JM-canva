<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="Templates JM Editáveis no Canva" />
<meta property="og:description" content="Design Editorial Exclusivo do Perfil Jornal Milionários Barreiro." />
<meta property="og:image" content="https://www.descodificado.com.br/JM-canva/miniatura.png" />
<meta property="og:url" content="https://www.descodificado.com.br/JM-canva/" />
<meta property="og:type" content="website" />
<title>Jornal Milionários</title>
<style>
  :root{
    --azul-claro:#29ABE2;
    --azul-escuro:#1B4F8C;
    --azul-profundo:#0E2A4D;
    --branco:#FFFFFF;
    --cinza:#6E7B8B;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(180deg,#f4f8fb 0%,#e8eef5 100%);
    color:var(--azul-profundo);
    padding-bottom:60px;
  }

  .topo{
    width:100%;
    max-height:280px;
    overflow:hidden;
    position:relative;
    display:flex;
    justify-content:center;
  }

  .topo img{
    width:100%;
    height:auto;
    max-height:280px;
    object-fit:cover;
    display:block;
  }

  .drive-area{
    display:flex;
    justify-content:center;
    padding:22px 16px 0;
  }

  .drive-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:12px 20px;
    border-radius:9px;
    background:#fff;
    color:#202124;
    border:1px solid #dadce0;
    box-shadow:0 3px 10px rgba(14,42,77,.08);
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    transition:transform .2s ease,box-shadow .2s ease;
  }

  .drive-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 5px 14px rgba(14,42,77,.12);
  }

  .drive-btn svg{
    width:22px;
    height:22px;
    flex:0 0 22px;
  }

  .grid{
    max-width:1100px;
    margin:0 auto;
    padding:24px 16px;
    display:grid;
    grid-template-columns:1fr;
    justify-content:center;
    gap:22px;
  }

  .card{
    width:100%;
    max-width:480px;
    margin:0 auto;
    background:var(--branco);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 6px 18px rgba(14,42,77,.12);
    border:1px solid rgba(27,79,140,.08);
    display:flex;
    flex-direction:column;
  }

  .card-img-wrap{
    width:100%;
    min-height:220px;
    background:#fff;
    border-bottom:1px solid var(--azul-claro);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
  }

  .card-img-wrap img{
    width:100%;
    height:auto;
    display:block;
  }

  .card-body{
    padding:16px 18px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:12px;
    flex:1;
  }

  .card-title{
    font-size:17px;
    font-weight:700;
    color:var(--azul-profundo);
  }

  .card-btn{
    margin-top:auto;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:linear-gradient(90deg,var(--azul-claro),var(--azul-escuro));
    color:#fff;
    text-decoration:none;
    padding:11px 18px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    letter-spacing:.3px;
    transition:opacity .2s ease,transform .2s ease;
  }

  .card-btn:hover{opacity:.92;transform:scale(1.02);}
  .card-btn:active{transform:scale(.98);}

  .rodape{
    text-align:center;
    color:var(--cinza);
    font-size:13px;
    padding:30px 16px 10px;
  }
</style>
</head>
<body>

  <div class="topo">
    <img src="topo.png" alt="Jornal Milionários">
  </div>

  <div class="drive-area">
    <a class="drive-btn" href="https://drive.google.com/drive/u/0/folders/1R9-_unp5xud5RqMx4swq0eOturYH9H5w?usp=drive_link&pli=1" target="_blank" rel="noopener" aria-label="Abrir Google Drive">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#0F9D58" d="M7.74 3h4.52l4.52 7.83h-4.52z"/>
        <path fill="#F4B400" d="M7.74 3 3.22 10.83l2.26 3.92L10 6.92z"/>
        <path fill="#4285F4" d="M5.48 14.75h9.04l2.26-3.92h-9.04z"/>
        <path fill="#4285F4" d="m14.52 14.75-2.26 3.92h4.52L21.3 10.83h-4.52z"/>
        <path fill="#0F9D58" d="M3.22 10.83 7.74 18.67h4.52l-4.52-7.84z"/>
      </svg>
      <span>Google Drive</span>
    </a>
  </div>

  <main class="grid">

    <section class="card">
      <div class="card-img-wrap">
        <img src="post-positivo.png" alt="Post - Positivo" onerror="this.style.display='none'">
      </div>
      <div class="card-body">
        <div class="card-title">Post - Positivo</div>
        <a class="card-btn" href="https://canva.link/swm0mxb89hotkfi" target="_blank" rel="noopener">Abrir no Canva ↗</a>
      </div>
    </section>

    <section class="card">
      <div class="card-img-wrap">
        <img src="post-negativo.png" alt="Post - Negativo" onerror="this.style.display='none'">
      </div>
      <div class="card-body">
        <div class="card-title">Post - Negativo</div>
        <a class="card-btn" href="https://canva.link/m1zyblm9ld9hj9i" target="_blank" rel="noopener">Abrir no Canva ↗</a>
      </div>
    </section>

    <section class="card">
      <div class="card-img-wrap">
        <img src="capa-reels-negativo-positivo.png" alt="Capa para Reels - Negativo e Positivo" onerror="this.style.display='none'">
      </div>
      <div class="card-body">
        <div class="card-title">Capa para Reels - Negativo e Positivo</div>
        <a class="card-btn" href="https://canva.link/jlecy5tkoq8n1yw" target="_blank" rel="noopener">Abrir no Canva ↗</a>
      </div>
    </section>

    <section class="card">
      <div class="card-img-wrap">
        <img src="capa-youtube-podcast.png" alt="Capa YouTube Podcast" onerror="this.style.display='none'">
      </div>
      <div class="card-body">
        <div class="card-title">Capa YouTube Podcast</div>
        <a class="card-btn" href="https://canva.link/ko4wj7mol08chej" target="_blank" rel="noopener">Abrir no Canva ↗</a>
      </div>
    </section>

    <section class="card">
      <div class="card-img-wrap">
        <img src="desaparecido-editavel.png" alt="Desaparecido" onerror="this.style.display='none'">
      </div>
      <div class="card-body">
        <div class="card-title">Desaparecido</div>
        <a class="card-btn" href="https://canva.link/ygjwqzg1pamwchm" target="_blank" rel="noopener">Abrir no Canva ↗</a>
      </div>
    </section>

  </main>

  <p class="rodape">Por Adriele Almeida • Estrategista Digital</p>

</body>
</html>
